name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout transient
        uses: actions/checkout@v4
        with:
          repository: Dmoulart/transient
          ref: alpha-0.1
          path: transient

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.4

      - name: Cache bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'transient/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Build & link transient
        run: |
          cd transient && bun install && bun run build
          cd packages/nuxt && bun link

      - name: Install dependencies
        run: bun install

      - name: Run build
        # baked into the static html: repository variables (Settings > Secrets and variables > Variables)
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          BACK_URL: ${{ vars.BACK_URL }}
          CLD_CLOUDNAME: ${{ vars.CLD_CLOUDNAME }}
        run: |
          : "${BASE_URL:?}" "${BACK_URL:?}" "${CLD_CLOUDNAME:?}"
          bun run generate
